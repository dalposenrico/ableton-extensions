<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plugin Mixer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1a;
    color: #d4d4d4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  .header {
    padding: 10px 14px 8px;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .header h1 { font-size: 13px; font-weight: 600; color: #eee; letter-spacing: 0.3px; }

  /* ── Track columns ── */
  .mixer {
    flex: 1;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 12px;
    gap: 10px;
  }

  .track-col {
    min-width: 160px;
    max-width: 160px;
    display: flex;
    flex-direction: column;
    background: #242424;
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .track-header {
    padding: 8px 10px 7px;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-bottom: 2px solid transparent;
  }

  .devices-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .device-slot {
    background: #2e2e2e;
    border-radius: 4px;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    cursor: default;
    transition: background 0.1s;
  }
  .device-slot:hover { background: #363636; }

  .device-name {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #ccc;
    font-size: 11px;
  }

  .device-actions {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .device-slot:hover .device-actions { opacity: 1; }

  .icon-btn {
    background: none;
    border: none;
    color: #888;
    cursor: pointer;
    padding: 1px 3px;
    border-radius: 3px;
    font-size: 11px;
    line-height: 1;
    transition: color 0.1s, background 0.1s;
  }
  .icon-btn:hover { color: #eee; background: #444; }
  .icon-btn.danger:hover { color: #ff6b6b; background: #3a2020; }

  .add-track-btn {
    margin: 6px;
    padding: 6px;
    background: #2a2a2a;
    border: 1px dashed #444;
    border-radius: 4px;
    color: #666;
    cursor: pointer;
    text-align: center;
    font-size: 11px;
    transition: border-color 0.1s, color 0.1s;
    flex-shrink: 0;
  }
  .add-track-btn:hover { border-color: #888; color: #ccc; }

  /* ── Bottom bar ── */
  .bottom-bar {
    border-top: 1px solid #333;
    padding: 10px 14px;
    flex-shrink: 0;
  }

  .add-all-section {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .search-wrap {
    flex: 1;
    position: relative;
  }

  .search-input {
    width: 100%;
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 5px;
    padding: 6px 10px;
    color: #ddd;
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: #666; }
  .search-input::placeholder { color: #555; }

  .dropdown {
    position: absolute;
    bottom: calc(100% + 4px);
    left: 0; right: 0;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 5px;
    max-height: 180px;
    overflow-y: auto;
    z-index: 100;
    display: none;
  }
  .dropdown.open { display: block; }

  .dropdown-item {
    padding: 6px 10px;
    cursor: pointer;
    font-size: 11px;
    color: #ccc;
    transition: background 0.1s;
  }
  .dropdown-item:hover, .dropdown-item.active { background: #3a3a3a; color: #fff; }

  .add-all-btn {
    background: #3a5f3a;
    border: none;
    border-radius: 5px;
    color: #9fda9f;
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s;
    flex-shrink: 0;
  }
  .add-all-btn:hover { background: #4a7a4a; }
  .add-all-btn:disabled { opacity: 0.4; cursor: default; }

  .done-btn {
    background: #1e3a5f;
    border: none;
    border-radius: 5px;
    color: #9fc8ef;
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s;
    flex-shrink: 0;
  }
  .done-btn:hover { background: #2a4f7a; }

  /* ── Per-track add dropdown ── */
  .track-add-wrap {
    position: relative;
  }
  .track-add-wrap .dropdown {
    bottom: auto;
    top: calc(100% + 4px);
    left: 6px; right: 6px;
    width: auto;
  }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

  .empty-state {
    color: #555;
    font-size: 11px;
    padding: 10px 6px;
    text-align: center;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Plugin Mixer</h1>
  <button class="done-btn" id="doneBtn">Done</button>
</div>

<div class="mixer" id="mixer"></div>

<div class="bottom-bar">
  <div class="add-all-section">
    <div class="search-wrap" id="globalSearchWrap">
      <input class="search-input" id="globalSearch" placeholder="Search devices to add to all tracks…" autocomplete="off" />
      <div class="dropdown" id="globalDropdown"></div>
    </div>
    <button class="add-all-btn" id="addAllBtn" disabled>+ Add to All</button>
  </div>
</div>

<script>
  // ── Injected data ──────────────────────────────────────────────────────
  const TRACKS = "__TRACKS_DATA__";
  const ALL_DEVICES = "__DEVICES_DATA__";

  // ── Pending actions queue (sent back on Done) ─────────────────────────
  const pendingActions = [];

  // ── Helpers ──────────────────────────────────────────────────────────
  function colorToHex(n) {
    return "#" + n.toString(16).padStart(6, "0");
  }

  function lighten(hex, amount = 40) {
    let r = parseInt(hex.slice(1, 3), 16);
    let g = parseInt(hex.slice(3, 5), 16);
    let b = parseInt(hex.slice(5, 7), 16);
    r = Math.min(255, r + amount);
    g = Math.min(255, g + amount);
    b = Math.min(255, b + amount);
    return `rgb(${r},${g},${b})`;
  }

  // ── Render ────────────────────────────────────────────────────────────
  const mixer = document.getElementById("mixer");

  function renderAll() {
    mixer.innerHTML = "";
    TRACKS.forEach((track, ti) => renderTrack(track, ti));
  }

  function renderTrack(track, ti) {
    const col = document.createElement("div");
    col.className = "track-col";
    col.dataset.ti = ti;

    const hex = colorToHex(track.color);
    const header = document.createElement("div");
    header.className = "track-header";
    header.style.borderBottomColor = hex;
    header.style.color = lighten(hex);
    header.textContent = track.name;
    col.appendChild(header);

    const list = document.createElement("div");
    list.className = "devices-list";

    if (track.devices.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No devices";
      list.appendChild(empty);
    } else {
      track.devices.forEach((dev, di) => {
        const slot = document.createElement("div");
        slot.className = "device-slot";

        const name = document.createElement("div");
        name.className = "device-name";
        name.textContent = dev.name;
        name.title = dev.name;
        slot.appendChild(name);

        const actions = document.createElement("div");
        actions.className = "device-actions";

        const dupBtn = document.createElement("button");
        dupBtn.className = "icon-btn";
        dupBtn.title = "Duplicate";
        dupBtn.textContent = "⧉";
        dupBtn.onclick = () => {
          pendingActions.push({ action: "duplicate", trackIndex: ti, deviceIndex: di });
          const newDev = { name: dev.name, index: track.devices.length };
          track.devices.push(newDev);
          renderAll();
        };
        actions.appendChild(dupBtn);

        const delBtn = document.createElement("button");
        delBtn.className = "icon-btn danger";
        delBtn.title = "Delete";
        delBtn.textContent = "×";
        delBtn.onclick = () => {
          pendingActions.push({ action: "delete", trackIndex: ti, deviceIndex: di });
          track.devices.splice(di, 1);
          track.devices.forEach((d, i) => d.index = i);
          renderAll();
        };
        actions.appendChild(delBtn);

        slot.appendChild(actions);
        list.appendChild(slot);
      });
    }

    col.appendChild(list);

    // Per-track add
    const addWrap = document.createElement("div");
    addWrap.className = "track-add-wrap";
    const addBtn = document.createElement("button");
    addBtn.className = "add-track-btn";
    addBtn.textContent = "+ Add device to this track";

    let trackSearch = null;
    let trackDropdown = null;

    addBtn.onclick = (e) => {
      e.stopPropagation();
      if (addWrap.querySelector(".search-input")) return;

      trackSearch = document.createElement("input");
      trackSearch.className = "search-input";
      trackSearch.placeholder = "Search…";
      trackSearch.style.margin = "0 0 4px 0";

      trackDropdown = document.createElement("div");
      trackDropdown.className = "dropdown open";

      addBtn.replaceWith(trackSearch);
      addWrap.appendChild(trackDropdown);
      trackSearch.focus();

      function filterTrackDevices(q) {
        const filtered = q
          ? ALL_DEVICES.filter(d => d.toLowerCase().includes(q.toLowerCase()))
          : ALL_DEVICES;
        trackDropdown.innerHTML = "";
        filtered.slice(0, 30).forEach(d => {
          const item = document.createElement("div");
          item.className = "dropdown-item";
          item.textContent = d;
          item.onclick = () => {
            const pos = track.devices.length;
            pendingActions.push({ action: "insert", trackIndex: ti, deviceName: d, position: pos });
            track.devices.push({ name: d, index: pos });
            renderAll();
          };
          trackDropdown.appendChild(item);
        });
      }

      filterTrackDevices("");
      trackSearch.addEventListener("input", () => filterTrackDevices(trackSearch.value));
    };

    addWrap.appendChild(addBtn);
    col.appendChild(addWrap);
    mixer.appendChild(col);
  }

  // ── Global search / Add to all ────────────────────────────────────────
  const globalSearch = document.getElementById("globalSearch");
  const globalDropdown = document.getElementById("globalDropdown");
  const addAllBtn = document.getElementById("addAllBtn");
  let selectedDevice = null;

  function filterGlobal(q) {
    const filtered = q
      ? ALL_DEVICES.filter(d => d.toLowerCase().includes(q.toLowerCase()))
      : ALL_DEVICES;
    globalDropdown.innerHTML = "";
    globalDropdown.classList.toggle("open", q.length > 0);

    filtered.slice(0, 30).forEach(d => {
      const item = document.createElement("div");
      item.className = "dropdown-item";
      item.textContent = d;
      item.onclick = () => {
        globalSearch.value = d;
        selectedDevice = d;
        globalDropdown.classList.remove("open");
        addAllBtn.disabled = false;
      };
      globalDropdown.appendChild(item);
    });
  }

  globalSearch.addEventListener("input", () => {
    selectedDevice = null;
    addAllBtn.disabled = true;
    filterGlobal(globalSearch.value);
  });

  globalSearch.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      globalDropdown.classList.remove("open");
      selectedDevice = null;
      addAllBtn.disabled = true;
    }
  });

  addAllBtn.addEventListener("click", () => {
    if (!selectedDevice) return;
    pendingActions.push({ action: "insert_all", deviceName: selectedDevice });
    TRACKS.forEach(track => {
      track.devices.push({ name: selectedDevice, index: track.devices.length });
    });
    globalSearch.value = "";
    selectedDevice = null;
    addAllBtn.disabled = true;
    globalDropdown.classList.remove("open");
    renderAll();
  });

  document.addEventListener("click", (e) => {
    if (!document.getElementById("globalSearchWrap").contains(e.target)) {
      globalDropdown.classList.remove("open");
    }
  });

  // ── Done ─────────────────────────────────────────────────────────────
  document.getElementById("doneBtn").addEventListener("click", () => {
    const result = JSON.stringify(pendingActions);
    if (window.webkit?.messageHandlers?.live) {
      window.webkit.messageHandlers.live.postMessage({ method: "close_and_send", params: [result] });
    } else if (window.chrome?.webview) {
      window.chrome.webview.postMessage({ method: "close_and_send", params: [result] });
    }
  });

  // ── Init ─────────────────────────────────────────────────────────────
  renderAll();
</script>
</body>
</html>
