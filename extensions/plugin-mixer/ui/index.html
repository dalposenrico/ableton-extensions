<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Plugin Mixer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1c1c1c;
    color: #ccc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 11px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ── Top bar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: #161616;
    border-bottom: 1px solid #2a2a2a;
    flex-shrink: 0;
  }
  .topbar h1 { font-size: 12px; font-weight: 600; color: #eee; letter-spacing: 0.5px; }
  .done-btn {
    background: #2a4a6a;
    border: none; border-radius: 4px;
    color: #8cc8f0; padding: 5px 14px;
    font-size: 11px; cursor: pointer;
    transition: background 0.1s;
  }
  .done-btn:hover { background: #3a5a7a; }

  /* ── Mixer grid ── */
  .mixer-wrap {
    flex: 1;
    overflow: auto;
    position: relative;
  }

  table {
    border-collapse: collapse;
    min-width: 100%;
  }

  /* Sticky track header row */
  thead tr th {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #1a1a1a;
    border-right: 1px solid #2a2a2a;
    border-bottom: 2px solid #333;
    padding: 0;
    min-width: 130px;
    width: 130px;
  }

  .track-header-cell {
    padding: 6px 8px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.3px;
    color: #bbb;
    border-bottom: 2px solid var(--track-color, #444);
  }

  /* Slot label column */
  .slot-label-col {
    position: sticky;
    left: 0;
    z-index: 5;
    background: #181818;
    border-right: 2px solid #333;
    width: 36px;
    min-width: 36px;
  }
  thead th.slot-label-col {
    z-index: 15;
    border-bottom: 2px solid #333;
  }

  .slot-label {
    writing-mode: horizontal-tb;
    font-size: 9px;
    color: #555;
    text-align: center;
    padding: 4px 2px;
    letter-spacing: 0.2px;
    font-weight: 600;
  }

  /* Body rows */
  tbody tr {
    border-bottom: 1px solid #222;
  }
  tbody tr:hover td { background: #212121; }
  tbody tr:hover td.slot-label-col { background: #1e1e1e; }

  /* Slot cells */
  td {
    border-right: 1px solid #252525;
    padding: 2px 3px;
    vertical-align: top;
    background: #1c1c1c;
    height: 28px;
  }

  .plugin-slot {
    height: 24px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    padding: 0 6px;
    cursor: pointer;
    gap: 4px;
    transition: background 0.1s;
    position: relative;
  }

  .plugin-slot.filled {
    background: #2a3a2a;
    border: 1px solid #3a5a3a;
  }
  .plugin-slot.filled:hover { background: #344834; }

  .plugin-slot.empty {
    background: transparent;
    border: 1px dashed #2a2a2a;
    color: #383838;
  }
  .plugin-slot.empty:hover {
    border-color: #555;
    background: #222;
    color: #666;
  }

  .plugin-name {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 10px;
    color: #9fd09f;
  }

  .slot-actions {
    display: none;
    gap: 1px;
    flex-shrink: 0;
  }
  .plugin-slot.filled:hover .slot-actions { display: flex; }

  .slot-btn {
    background: none; border: none;
    color: #666; cursor: pointer;
    font-size: 10px; padding: 1px 2px;
    border-radius: 2px; line-height: 1;
    transition: color 0.1s, background 0.1s;
  }
  .slot-btn:hover { color: #ccc; background: #444; }
  .slot-btn.del:hover { color: #f08080; background: #3a2020; }

  .plus-icon { font-size: 12px; color: #333; }

  /* ── Add row ── */
  .add-row td {
    padding: 3px;
    border-top: 2px solid #282828;
  }
  .add-slot-btn {
    width: 100%; height: 22px;
    background: none;
    border: 1px dashed #333;
    border-radius: 3px;
    color: #555; cursor: pointer;
    font-size: 11px;
    transition: border-color 0.1s, color 0.1s;
  }
  .add-slot-btn:hover { border-color: #666; color: #999; }

  /* ── Dropdown ── */
  .dropdown-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
  }
  .dropdown-overlay.open { display: block; }

  .dropdown-box {
    position: fixed;
    background: #252525;
    border: 1px solid #444;
    border-radius: 5px;
    width: 200px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 101;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }

  .dropdown-search {
    width: 100%;
    background: #1e1e1e;
    border: none;
    border-bottom: 1px solid #333;
    padding: 7px 10px;
    color: #ddd;
    font-size: 11px;
    outline: none;
  }

  .dropdown-list { padding: 4px 0; }

  .dropdown-item {
    padding: 5px 10px;
    cursor: pointer;
    font-size: 11px;
    color: #bbb;
    transition: background 0.08s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dropdown-item:hover { background: #333; color: #fff; }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #444; }
</style>
</head>
<body>

<div class="topbar">
  <h1>Plugin Mixer</h1>
  <button class="done-btn" id="doneBtn">Done</button>
</div>

<div class="mixer-wrap">
  <table id="mixerTable"></table>
</div>

<!-- Floating dropdown for device picker -->
<div class="dropdown-overlay" id="dropdownOverlay">
  <div class="dropdown-box" id="dropdownBox">
    <input class="dropdown-search" id="dropdownSearch" placeholder="Search devices…" autocomplete="off" />
    <div class="dropdown-list" id="dropdownList"></div>
  </div>
</div>

<script>
  const TRACKS = '__TRACKS_DATA__';
  const ALL_DEVICES = '__DEVICES_DATA__';

  const pendingActions = [];

  // ── Track colour palette (since SDK doesn't expose track.color) ───────────
  const PALETTE = [
    '#5a8a5a','#5a6a8a','#8a5a5a','#7a6a4a','#5a7a8a',
    '#7a5a8a','#6a8a5a','#8a6a5a','#5a8a7a','#6a5a8a',
  ];
  function trackColor(i) { return PALETTE[i % PALETTE.length]; }

  // ── How many insert slots to show ─────────────────────────────────────────
  const MAX_SLOTS = Math.max(10, ...TRACKS.map(t => t.devices.length + 1));

  // ── Build table ───────────────────────────────────────────────────────────
  function buildTable() {
    const table = document.getElementById('mixerTable');
    table.innerHTML = '';

    // Head
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');

    // Slot label corner cell
    const corner = document.createElement('th');
    corner.className = 'slot-label-col';
    corner.innerHTML = '';
    headRow.appendChild(corner);

    TRACKS.forEach((t, ti) => {
      const th = document.createElement('th');
      const color = trackColor(ti);
      th.innerHTML = `<div class="track-header-cell" style="--track-color:${color}">${escHtml(t.name)}</div>`;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    // Body rows — one per insert slot
    const tbody = document.createElement('tbody');
    for (let slot = 0; slot < MAX_SLOTS; slot++) {
      const row = document.createElement('tr');

      // Slot label
      const labelTd = document.createElement('td');
      labelTd.className = 'slot-label-col';
      labelTd.innerHTML = `<div class="slot-label">${slot + 1}</div>`;
      row.appendChild(labelTd);

      // One cell per track
      TRACKS.forEach((t, ti) => {
        const td = document.createElement('td');
        const dev = t.devices[slot];
        if (dev) {
          td.innerHTML = `
            <div class="plugin-slot filled" data-ti="${ti}" data-di="${slot}">
              <span class="plugin-name" title="${escHtml(dev.name)}">${escHtml(dev.name)}</span>
              <span class="slot-actions">
                <button class="slot-btn del" data-action="delete" data-ti="${ti}" data-di="${slot}" title="Delete">×</button>
                <button class="slot-btn" data-action="duplicate" data-ti="${ti}" data-di="${slot}" title="Duplicate">⧉</button>
              </span>
            </div>`;
        } else {
          td.innerHTML = `
            <div class="plugin-slot empty" data-ti="${ti}" data-slot="${slot}">
              <span class="plus-icon">+</span>
            </div>`;
        }
        row.appendChild(td);
      });
      tbody.appendChild(row);
    }

    table.appendChild(tbody);
  }

  // ── Event delegation ──────────────────────────────────────────────────────
  document.getElementById('mixerTable').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (btn) {
      e.stopPropagation();
      const ti = parseInt(btn.dataset.ti);
      const di = parseInt(btn.dataset.di);
      if (btn.dataset.action === 'delete') {
        pendingActions.push({ action: 'delete', trackIndex: ti, deviceIndex: di });
        TRACKS[ti].devices.splice(di, 1);
        TRACKS[ti].devices.forEach((d, i) => d.index = i);
        buildTable();
      } else if (btn.dataset.action === 'duplicate') {
        const dev = TRACKS[ti].devices[di];
        if (dev) {
          pendingActions.push({ action: 'duplicate', trackIndex: ti, deviceIndex: di });
          TRACKS[ti].devices.splice(di + 1, 0, { name: dev.name, index: di + 1 });
          TRACKS[ti].devices.forEach((d, i) => d.index = i);
          buildTable();
        }
      }
      return;
    }

    // Click on empty slot → open device picker
    const emptySlot = e.target.closest('.plugin-slot.empty');
    if (emptySlot) {
      const ti = parseInt(emptySlot.dataset.ti);
      const slot = parseInt(emptySlot.dataset.slot);
      openDropdown(ti, slot, emptySlot);
      return;
    }

    // Click on filled slot (not on buttons) → open device picker to replace
    const filledSlot = e.target.closest('.plugin-slot.filled');
    if (filledSlot && !e.target.closest('.slot-btn')) {
      const ti = parseInt(filledSlot.dataset.ti);
      const di = parseInt(filledSlot.dataset.di);
      // Delete existing then insert at same position
      openDropdown(ti, di, filledSlot, true);
    }
  });

  // ── Dropdown ──────────────────────────────────────────────────────────────
  let dropdownTarget = null; // { ti, slot, replace }

  function openDropdown(ti, slot, anchorEl, replace = false) {
    dropdownTarget = { ti, slot, replace };
    const overlay = document.getElementById('dropdownOverlay');
    const box = document.getElementById('dropdownBox');
    const search = document.getElementById('dropdownSearch');

    // Position near the clicked slot
    const rect = anchorEl.getBoundingClientRect();
    box.style.left = Math.min(rect.left, window.innerWidth - 210) + 'px';
    box.style.top = (rect.bottom + 4) + 'px';

    overlay.classList.add('open');
    search.value = '';
    filterDropdown('');
    search.focus();
  }

  function closeDropdown() {
    document.getElementById('dropdownOverlay').classList.remove('open');
    dropdownTarget = null;
  }

  function filterDropdown(q) {
    const list = document.getElementById('dropdownList');
    const filtered = q ? ALL_DEVICES.filter(d => d.toLowerCase().includes(q.toLowerCase())) : ALL_DEVICES;
    list.innerHTML = '';
    filtered.slice(0, 40).forEach(d => {
      const item = document.createElement('div');
      item.className = 'dropdown-item';
      item.textContent = d;
      item.onclick = () => selectDevice(d);
      list.appendChild(item);
    });
  }

  function selectDevice(deviceName) {
    if (!dropdownTarget) return;
    const { ti, slot, replace } = dropdownTarget;

    if (replace) {
      // Delete existing first, then insert at same slot
      pendingActions.push({ action: 'delete', trackIndex: ti, deviceIndex: slot });
      TRACKS[ti].devices.splice(slot, 1);
      pendingActions.push({ action: 'insert', trackIndex: ti, deviceName, position: slot });
      TRACKS[ti].devices.splice(slot, 0, { name: deviceName, index: slot });
    } else {
      pendingActions.push({ action: 'insert', trackIndex: ti, deviceName, position: slot });
      TRACKS[ti].devices.splice(slot, 0, { name: deviceName, index: slot });
    }
    TRACKS[ti].devices.forEach((d, i) => d.index = i);

    closeDropdown();
    buildTable();
  }

  document.getElementById('dropdownOverlay').addEventListener('click', closeDropdown);
  document.getElementById('dropdownSearch').addEventListener('input', e => filterDropdown(e.target.value));
  document.getElementById('dropdownSearch').addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDropdown();
  });

  // ── Done ──────────────────────────────────────────────────────────────────
  document.getElementById('doneBtn').addEventListener('click', () => {
    const result = JSON.stringify(pendingActions);
    if (window.webkit?.messageHandlers?.live) {
      window.webkit.messageHandlers.live.postMessage({ method: 'close_and_send', params: [result] });
    } else if (window.chrome?.webview) {
      window.chrome.webview.postMessage({ method: 'close_and_send', params: [result] });
    }
  });

  // ── Utils ─────────────────────────────────────────────────────────────────
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  buildTable();
</script>
</body>
</html>
